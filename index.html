<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RonaldAnime - Stream en vivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0e0e10; font-family: 'Inter', system-ui, sans-serif; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    width: 100%;
    padding: 14px 20px;
    background: #18181b;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #9146FF;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #eb0400; animation: pulse 1.5s infinite; }
  header h1 { font-size: 16px; font-weight: 600; }
  header a { margin-left: auto; color: #9146FF; text-decoration: none; font-size: 13px; font-weight: 600; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  main {
    width: 100%;
    max-width: 1400px;
    flex: 1;
    display: flex;
    flex-wrap: wrap;
  }
  .player-col {
    flex: 3 1 640px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .info { padding: 16px 20px; color: #efeff1; }
  .info p { color: #adadb8; font-size: 14px; line-height: 1.5; }

  .chat-col {
    flex: 1 1 320px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    background: #18181b;
    border-left: 1px solid #26262c;
  }
  .chat-col iframe { flex: 1; width: 100%; border: 0; min-height: 500px; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    .chat-col { border-left: none; border-top: 1px solid #26262c; }
    .chat-col iframe { min-height: 400px; }
  }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>RonaldAnime</h1>
    <a href="https://www.twitch.tv/ronaldanime" target="_blank" rel="noopener">Ver en Twitch ↗</a>
  </header>
  <main>
    <div class="player-col">
      <div class="player-wrap">
        <iframe id="twitch-player" src="" allowfullscreen></iframe>
      </div>
      <div class="info">
        <p>Reproductor incrustado del canal de Twitch de RonaldAnime. Si aparece "offline" es porque el streamer no está transmitiendo en este momento.</p>
      </div>
    </div>
    <div class="chat-col">
      <iframe id="twitch-chat" src=""></iframe>
    </div>
  </main>

  <script>
    // Twitch exige que el dominio (host) exacto desde donde se sirve la página
    // se pase como parámetro "parent". Lo detectamos automáticamente aquí,
    // así funciona sin tocar el código sin importar en qué dominio la publiques.
    var host = window.location.hostname || "localhost";
    var channel = "ronaldanime";

    document.getElementById('twitch-player').src =
      "https://player.twitch.tv/?channel=" + channel + "&parent=" + host + "&muted=false";

    document.getElementById('twitch-chat').src =
      "https://www.twitch.tv/embed/" + channel + "/chat?parent=" + host + "&darkpopout";
  </script>
</body>
</html>
